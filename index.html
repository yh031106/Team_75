<html lang="ko">
<head>
  <meta charset="utf-8" />

  <title>TaskLens - 과제 요구사항 체크리스트</title>
  <meta name="description" content="긴 과제 안내문을 붙여넣으면 핵심 요구사항을 체크리스트로 정리해주는 MVP" />

  <style>
    :root{
      --bg:#f6f7f9; --card:#fff; --text:#15171a; --muted:#69707a; --line:#e6e8eb;
      --accent:#111827; --soft:#eef1f5;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,Arial,sans-serif}
    .wrap{max-width:920px;margin:0 auto;padding:56px 20px 80px}

    h1{font-size:42px;line-height:1.15;margin:18px 0 10px;letter-spacing:-1.3px}
    .lead{font-size:18px;color:var(--muted);line-height:1.7;margin-bottom:32px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.04)}
    label{display:block;font-weight:700;margin-bottom:10px}
    textarea{width:100%;min-height:260px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:15px;line-height:1.65;outline:none}
    textarea:focus{border-color:#9ca3af}
    .row{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
    button{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}
    .primary{background:var(--accent);color:white}
    .secondary{background:var(--soft);color:var(--text)}
    .hint{font-size:13px;color:var(--muted)}
    #result{display:none;margin-top:24px}
    .result-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
    .score{font-size:14px;color:var(--muted)}
    ul{list-style:none;padding:0;margin:0}
    li{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
    li:last-child{border-bottom:0}
    input[type=checkbox]{margin-top:4px;width:18px;height:18px}
    .empty{padding:18px;background:#fafafa;border-radius:12px;color:var(--muted)}
    .footer{margin-top:18px;font-size:12px;color:var(--muted)}
    @media(max-width:640px){h1{font-size:34px}.wrap{padding-top:34px}.card{padding:18px}}

    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,17,20,.45);align-items:center;justify-content:center;padding:20px;z-index:50}
    .modal-overlay.open{display:flex}
    .modal-card{background:var(--card);border-radius:18px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .modal-card h2{margin:0 0 6px;font-size:20px}
    .modal-card p{margin:0 0 20px;color:var(--muted);font-size:13px}
    .field{margin-bottom:14px}
    .field label{font-size:13px;margin-bottom:6px}
    .field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;outline:none}
    .field input:focus{border-color:#9ca3af}
    .modal-actions{display:flex;gap:10px;margin-top:18px}
    .modal-actions button{flex:1}
  </style>
</head>
<body>
  <main class="wrap">
    <span class="badge">MVP Prototype</span>
    <h1>긴 과제 안내문,<br>체크리스트로 바로 바꿔봅시다!!</h1>
    <p class="lead">과제 공지나 평가 기준을 붙여넣으면 제출 전에 확인할 핵심 요구사항만 빠르게 뽑아줘.</p>

    <section class="card">
      <label for="input">과제 안내문 붙여넣기</label>
      <textarea id="input" placeholder="예) 1. 문제를 정의한다.&#10;2. AI 방법을 선택한다.&#10;- 선택 이유를 작성한다.&#10;- 한계와 대응 전략을 제시한다."></textarea>
      <div class="row">
        <button class="primary" id="generate">체크리스트 만들기</button>
        <button class="secondary" id="sample">예시 넣기</button>
        <span class="hint">개인정보는 입력하지 않는 것을 권장해.</span>
      </div>

      <section id="result">
        <div class="result-head">
          <strong>제출 체크리스트</strong>
          <span class="score" id="score">0 / 0 완료</span>
        </div>
        <ul id="list"></ul>
        <div class="row">
          <button class="secondary" id="copy">체크리스트 복사</button>
          <button class="secondary" id="reset">체크 해제</button>
        </div>
      </section>
    </section>
    <p class="footer">TaskLens v0.1 · 수업용 MVP 검증 프로토타입</p>
  </main>

  <div class="modal-overlay" id="infoModal">
    <div class="modal-card">
      <h2>과제 정보 입력</h2>
      <p>체크리스트를 만들기 전에 과목명과 마감일을 알려줘.</p>
      <div class="field">
        <label for="subjectInput">과목명</label>
        <input type="text" id="subjectInput" placeholder="예) AI 의사결정론" />
      </div>
      <div class="field">
        <label for="deadlineInput">과제 마감일</label>
        <input type="date" id="deadlineInput" />
      </div>
      <div class="modal-actions">
        <button class="secondary" id="modalCancel">취소</button>
        <button class="primary" id="modalConfirm">체크리스트 만들기</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

let supabaseClient = null;
if (SUPABASE_URL && SUPABASE_URL !== 'YOUR_SUPABASE_URL' && window.supabase) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function saveUsageRecord(subject, deadline){
  const usedAt = new Date();
  const usedAtStr = usedAt.toISOString().slice(0,10);
  const deadlineDate = new Date(deadline + 'T00:00:00');
  const msPerDay = 1000*60*60*24;
  const daysDiff = Math.round((deadlineDate - new Date(usedAtStr + 'T00:00:00')) / msPerDay);

  if (!supabaseClient){
    console.warn('[supabase] 아직 연결되지 않음. index.html의 SUPABASE_URL / SUPABASE_ANON_KEY를 채워줘.');
    return;
  }

  const { error } = await supabaseClient.from('checklist_usage').insert({
    subject,
    deadline,
    used_at: usedAtStr,
    days_diff: daysDiff,
  });

  if (error) console.error('[supabase] 저장 실패:', error.message);
}

<script>
const input = document.getElementById('input');
const result = document.getElementById('result');
const list = document.getElementById('list');
const score = document.getElementById('score');

function track(eventName, params={}) {
  if (typeof window.gtag === 'function') window.gtag('event', eventName, params);
  console.log('[event]', eventName, params);
}

function normalizeLine(line){
  return line
    .replace(/^\s*(?:[-*•▪︎◦]|\d+[\.\)]|[①-⑳]|\([0-9]+\))\s*/,'')
    .replace(/\*\*/g,'')
    .trim();
}

function condenseClause(raw){
  let t = raw;
  let obligation = false;
  let optional = false;

  const fillerLead = [/^총\s*/, /^참고로\s*/, /^그리고\s*/, /^또한\s*/, /^아울러\s*/,
    /^please\s+/i, /^kindly\s+/i, /^note that\s+/i, /^make sure to\s+/i, /^you (?:should|must|need to)\s+/i];
  for (const re of fillerLead) t = t.replace(re, '');

  const obligationEndings = /(?:(?:해|하)\s*주셔야\s*합니다|(?:하|되)셔야\s*합니다|(?:해|하)야\s*합니다|(?:하|되)여야\s*합니다)\.?/;
  const optionalEndings = /(?:선택사항(?:입니다|이며)?|선택입니다)\.?/;
  const requiredEndings = /(?:필수사항(?:입니다|이며)?|필수입니다)\.?/;

  if (obligationEndings.test(t)) { obligation = true; t = t.replace(obligationEndings, ''); }
  if (optionalEndings.test(t)) { optional = true; t = t.replace(optionalEndings, ''); }
  if (requiredEndings.test(t)) { obligation = true; t = t.replace(requiredEndings, ''); }

  const softEndings = [
    /(?:해|하)\s*주(?:시면|시기)?\s*됩니다\.?/g,
    /(?:해|하)\s*주세요\.?/g,
    /주시기\s*바랍니다\.?/g,
    /부탁\s*드립니다\.?/g,
    /(?:하|되)시기\s*바랍니다\.?/g,
    /바랍니다\.?/g,
    /됩니다\.?$/g,
    /합니다\.?$/g,
    /입니다\.?$/g,
  ];
  for (const re of softEndings) t = t.replace(re, '');

  // 자주 쓰이는 지시 동사 축약
  t = t.replace(/(?:적어|기재해|작성해|써)\s*주(?:시면|세요|시기\s*바랍니다)?/g, '작성');
  t = t.replace(/첨부한\s*/g, '첨부 ');
  t = t.replace(/선택사항$/, '선택').replace(/필수사항$/, '필수');

  t = t.replace(/\s{2,}/g, ' ').trim();
  t = t.replace(/^[,.]+|[,.]+$/g, '').trim();

  if (obligation && !/필수/.test(t)) t = (t ? t + ' 필수' : '필수');
  if (optional && !/선택/.test(t)) t = (t ? t + ' 선택' : '선택');

  return t.trim();
}

function condenseText(text){
  const clauses = text
    .split(/,\s*|되고\s*|하고\s*|이고\s*|이며\s*|며\s*/)
    .map(condenseClause)
    .filter(Boolean);

  let result = clauses.length ? clauses.join(', ') : text;

  const MAX = 60;
  if (result.length > MAX){
    const cut = result.slice(0, MAX);
    const lastSpace = cut.lastIndexOf(' ');
    result = (lastSpace > 20 ? cut.slice(0, lastSpace) : cut) + '…';
  }

  return result;
}

function extractRequirements(text){
  const raw = text.split(/\n+/).map(s=>s.trim()).filter(Boolean);

  // 과제 관련 행동/의무를 나타내는 단어 (한글 + 영어)
  const actionRegex = /(작성|제시|설명|분석|비교|정의|선택|적용|포함|제출|평가|구분|설계|검증|정리|구성|제안|반영|첨부|업로드|기재|준수|충족|submit|deliverable|present|presentation|prepare|complete|include|upload|register|sign[\s-]?up|attend|format|requirement|required|must|should|need to|due|deadline|consultation|session|slide|assignment|grading|criteria|rubric)/i;

  // 날짜/시간/마감 관련 패턴 (한글 + 영어)
  const deadlineRegex = /(마감|기한|까지|due\s*date|제출일|\d{1,2}\s*\/\s*\d{1,2}|\d{4}\s*[.\-\/]\s*\d{1,2}\s*[.\-\/]\s*\d{1,2}|\d{1,2}\s*월\s*\d{1,2}\s*일|\d{1,2}\s*시(\s*\d{1,2}\s*분)?|\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{1,2}\b|\d{1,2}(:\d{2})?\s*(am|pm)\b|\b(mon|tue|wed|thu|fri|sat|sun)(day)?\b)/i;

  // "라벨: 내용" 형태의 구조화된 항목 (예: Deliverable: Slides, 제출 방식: PDF)
  const structuredKeyValue = /^[A-Za-z가-힣][A-Za-z0-9가-힣\s]{1,40}:\s*\S/;

  let items = [];

  for (const line of raw){
    const cleaned = normalizeLine(line);
    const isKeyValue = structuredKeyValue.test(cleaned);
    const hasAction = actionRegex.test(cleaned);
    const hasDeadline = deadlineRegex.test(cleaned);

    if ((isKeyValue || hasAction || hasDeadline) && cleaned.length >= 4 && cleaned.length <= 400) {
      items.push(cleaned);
    }
  }

  // 중복 제거
  items = [...new Set(items)];

  return items.slice(0, 15);
}

function render(items){
  list.innerHTML='';
  if(!items.length){
    list.innerHTML='<div class="empty">요구사항을 찾기 어려워. 번호나 불릿이 포함된 과제 안내문을 붙여넣어 봐.</div>';
    result.style.display='block';
    score.textContent='0 / 0 완료';
    return;
  }

  items.forEach((text, idx)=>{
    const li=document.createElement('li');
    const cb=document.createElement('input');
    cb.type='checkbox';
    cb.addEventListener('change', updateScore);
    const span=document.createElement('span');
    span.textContent=condenseText(text);
    if(span.textContent!==text) span.title=text;
    li.append(cb, span);
    list.appendChild(li);
  });
  result.style.display='block';
  updateScore();
}

function updateScore(){
  const boxes=[...list.querySelectorAll('input[type=checkbox]')];
  const done=boxes.filter(b=>b.checked).length;
  score.textContent=`${done} / ${boxes.length} 완료`;
  if(boxes.length && done===boxes.length){
    track('checklist_completed',{item_count:boxes.length});
    setTimeout(()=>{
      alert('수고하셨습니다! 🎉');
      resetToStart();
    }, 150);
  }
}

function resetToStart(){
  input.value='';
  list.innerHTML='';
  result.style.display='none';
  score.textContent='0 / 0 완료';
}

const infoModal = document.getElementById('infoModal');
const subjectInput = document.getElementById('subjectInput');
const deadlineInput = document.getElementById('deadlineInput');

document.getElementById('generate').addEventListener('click',()=>{
  const text=input.value.trim();
  if(!text){ alert('과제 안내문을 먼저 붙여넣어 줘.'); return; }
  subjectInput.value='';
  deadlineInput.value='';
  infoModal.classList.add('open');
  subjectInput.focus();
});

document.getElementById('modalCancel').addEventListener('click',()=>{
  infoModal.classList.remove('open');
});

document.getElementById('modalConfirm').addEventListener('click', async ()=>{
  const subject = subjectInput.value.trim();
  const deadline = deadlineInput.value;
  if(!subject){ alert('과목명을 입력해 줘.'); return; }
  if(!deadline){ alert('마감일을 선택해 줘.'); return; }

  infoModal.classList.remove('open');

  await saveUsageRecord(subject, deadline);

  const text=input.value.trim();
  const items=extractRequirements(text);
  render(items);
  track('checklist_generated',{item_count:items.length, subject, deadline});
});

document.getElementById('sample').addEventListener('click',()=>{
  input.value=`1. 전공 관련 의사결정 문제를 정확히 정의한다.
2. 문제를 구조화하고 원인을 분석한다.
3. 적합한 AI 의사결정 방법을 선택하고 적용한다.
4. 선택한 방법의 이유를 설명한다.
5. AI 방법의 한계를 분석한다.
6. 한계에 대한 대응 전략을 설계한다.
7. 최종 결과와 시사점을 정리한다.`;
  track('sample_loaded');
});

document.getElementById('copy').addEventListener('click',async()=>{
  const items=[...list.querySelectorAll('li span')].map((s,i)=>`- [ ] ${s.textContent}`);
  if(!items.length) return;
  await navigator.clipboard.writeText(items.join('\n'));
  alert('체크리스트를 복사했어.');
  track('checklist_copied',{item_count:items.length});
});

document.getElementById('reset').addEventListener('click',()=>{
  list.querySelectorAll('input[type=checkbox]').forEach(b=>b.checked=false);
  updateScore();
  track('checklist_reset');
});
</script>
</body>
</html>
